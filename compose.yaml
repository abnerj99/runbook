
services:
  db:
    image: postgres:18
    container_name: myapp-postgres

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data: